<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Coleção | Estilo Sob Medida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-['Inter']">

    <nav class="bg-white border-b p-4 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-orange-600 font-bold text-xl uppercase tracking-tighter italic">Estilo Sob Medida</a>
            <button onclick="document.getElementById('modal-add').classList.remove('hidden')" class="bg-orange-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-orange-700 transition-colors">
                <i class="fas fa-plus mr-2"></i> Adicionar Produto
            </button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-12 px-6">
        <div class="text-center mb-12">
            <h2 class="text-4xl font-bold text-gray-900">👗 Moda Feminina</h2>
            <p class="text-gray-500 mt-2">Descubra nossa coleção exclusiva. Elegância e sofisticação em cada peça.</p>
        </div>

        <div id="lista-produtos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
            <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all">
                <img src="https://qtrypzzcjebvfcihiynt.supabase.co/storage/v1/object/public/base44-prod/public/6978bc47a589772c8a9449a4/image_3172b3.jpg" class="w-full h-80 object-cover">
                <div class="p-6">
                    <h3 class="font-bold text-lg text-gray-800">Conjunto Alfaiataria Signature</h3>
                    <p class="text-sm text-gray-500 mt-2">Ideal para looks de trabalho e eventos sociais.</p>
                    <div class="mt-4 flex justify-between items-center">
                        <span class="text-orange-600 font-bold text-xl">R$ 249,90</span>
                        <button class="bg-orange-600 text-white p-3 rounded-xl hover:bg-orange-700"><i class="fas fa-cart-plus"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-add" class="fixed inset-0 bg-black/60 flex items-center justify-center hidden z-[60] px-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <h3 class="text-2xl font-bold mb-6">Novo Produto</h3>
            <form id="form-produto" class="space-y-4">
                <input type="text" id="nome" placeholder="Nome do Produto" class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none" required>
                <input type="text" id="preco" placeholder="Preço (ex: 159,90)" class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none" required>
                <input type="text" id="imagem" placeholder="Link da Imagem" class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none">
                <textarea id="desc" placeholder="Descrição curta" class="w-full border p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none"></textarea>
                
                <div class="flex gap-2">
                    <button type="button" onclick="this.closest('#modal-add').classList.add('hidden')" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold">Cancelar</button>
                    <button type="submit" class="flex-1 bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Lógica simples para adicionar produto na tela (Frontend)
        document.getElementById('form-produto').addEventListener('submit', function(e) {
            e.preventDefault();
            const nome = document.getElementById('nome').value;
            const preco = document.getElementById('preco').value;
            const imagem = document.getElementById('imagem').value || 'https://via.placeholder.com/400x500';
            const desc = document.getElementById('desc').value;

            const card = `
                <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all scale-up">
                    <img src="${imagem}" class="w-full h-80 object-cover">
                    <div class="p-6">
                        <h3 class="font-bold text-lg text-gray-800">${nome}</h3>
                        <p class="text-sm text-gray-500 mt-2">${desc}</p>
                        <div class="mt-4 flex justify-between items-center">
                            <span class="text-orange-600 font-bold text-xl">R$ ${preco}</span>
                            <button class="bg-orange-600 text-white p-3 rounded-xl hover:bg-orange-700"><i class="fas fa-cart-plus"></i></button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('lista-produtos').innerHTML += card;
            document.getElementById('modal-add').classList.add('hidden');
            this.reset();
        });
    </script>
</body>
</html>

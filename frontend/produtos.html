<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nossa Coleção | Crazy Look</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="images/alfaiate_favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">

    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 group">
                <i class="fas fa-chevron-left text-orange-600 group-hover:-translate-x-1 transition-transform"></i>
                <span class="text-orange-600 font-bold text-xl uppercase tracking-tighter italic">Crazy Look</span>
            </a>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-12 px-6 space-y-16">

        <section>
            <div class="text-center mb-10">
                <div class="inline-flex items-center gap-2 mb-2">
                    <i class="fas fa-female text-3xl text-pink-500"></i>
                    <h2 class="text-3xl md:text-4xl font-bold text-slate-900">Moda Feminina</h2>
                </div>
                <p class="text-slate-500">Descubra nossa coleção exclusiva de roupas femininas. Elegância e sofisticação.</p>
            </div>

            <div id="lista-feminina" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

            </div>
        </section>

        <section>
            <div class="text-center mb-10 pt-8 border-t border-gray-200">
                <div class="inline-flex items-center gap-2 mb-2 mt-8">
                    <i class="fas fa-male text-3xl text-blue-600"></i>
                    <h2 class="text-3xl md:text-4xl font-bold text-slate-900">Moda Masculina</h2>
                </div>
                <p class="text-slate-500">Peças clássicas e modernas para o homem contemporâneo.</p>
            </div>

            <div id="lista-masculina" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

            </div>
        </section>

    </main>

    <div id="modal-add" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-[60] px-4 transition-opacity">
        <div class="bg-white rounded-2xl p-8 max-w-md w-full shadow-2xl relative">
            <button onclick="this.closest('#modal-add').classList.add('hidden')" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <i class="fas fa-times text-xl"></i>
            </button>
            
            <h3 class="text-2xl font-bold mb-1 text-slate-900">Novo Produto</h3>
            <p class="text-sm text-slate-500 mb-6">Adicione um novo item ao catálogo.</p>
            
            <form id="form-produto" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Categoria</label>
                    <select id="categoria" class="w-full border border-gray-200 bg-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                        <option value="lista-feminina">Moda Feminina</option>
                        <option value="lista-masculina">Moda Masculina</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Nome do Produto</label>
                    <input type="text" id="nome" placeholder="Ex: Vestido de Seda" class="w-full border border-gray-200 bg-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all" required>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Preço</label>
                        <input type="text" id="preco" placeholder="199,90" class="w-full border border-gray-200 bg-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all" required>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Imagem URL</label>
                        <input type="text" id="imagem" placeholder="http://..." class="w-full border border-gray-200 bg-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Descrição</label>
                    <textarea id="desc" rows="2" placeholder="Breve descrição..." class="w-full border border-gray-200 bg-gray-50 p-3 rounded-xl focus:ring-2 focus:ring-orange-500 outline-none transition-all"></textarea>
                </div>
                
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="this.closest('#modal-add').classList.add('hidden')" class="flex-1 bg-white border border-gray-200 text-slate-600 py-3 rounded-xl font-bold hover:bg-gray-50 transition-colors">Cancelar</button>
                    <button type="submit" class="flex-1 bg-orange-600 text-white py-3 rounded-xl font-bold hover:bg-orange-700 transition-colors shadow-lg shadow-orange-600/20">Salvar Produto</button>
                </div>
            </form>
        </div>
    </div>

    <script>
    // Função que carrega os produtos salvos
    function loadProductsFromStorage() {
        const savedProducts = JSON.parse(localStorage.getItem('products')) || [];
        
        // Se não tiver nada salvo (primeira vez), não faz nada ou carrega padrões
        if (savedProducts.length === 0) return;

        // Limpa as listas atuais (opcional, se quiser substituir os hardcoded)
        // document.getElementById('lista-feminina').innerHTML = '';
        // document.getElementById('lista-masculina').innerHTML = '';

        savedProducts.forEach(prod => {
            const card = `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-xl transition-all group">
                    <div class="h-80 overflow-hidden">
                        <img src="${prod.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                    </div>
                    <div class="p-5">
                        <h3 class="font-bold text-lg text-slate-900 leading-tight">${prod.name}</h3>
                        <p class="text-xs text-slate-500 mt-2 line-clamp-2">${prod.desc}</p>
                        <div class="mt-4 pt-4 border-t border-gray-100 flex justify-between items-center">
                            <div>
                                <span class="text-xs text-slate-400 block">A partir de</span>
                                <span class="text-orange-600 font-bold text-lg">R$ ${prod.price}</span>
                            </div>
                            <button class="bg-orange-600 text-white px-4 py-2 rounded-lg hover:bg-orange-700 transition-colors flex items-center gap-2 text-sm font-bold">
                                <i class="fas fa-shopping-cart"></i> Adicionar
                            </button>
                        </div>
                    </div>
                </div>
            `;
            // Adiciona na categoria correta
            const container = document.getElementById(prod.category === 'lista-feminina' ? 'lista-feminina' : 'lista-masculina');
            if(container) container.innerHTML += card;
        });
    }

    // Carrega ao abrir a página
    window.onload = loadProductsFromStorage;

    // Lógica do Modal de Adicionar (Para funcionar igual ao admin se quiser manter o botão aqui também)
    document.getElementById('form-produto')?.addEventListener('submit', function(e) {
        // ... (seu código antigo de adicionar visualmente)
        // Mas o ideal é adicionar apenas pelo Admin agora!
    });
</script>
</body>
</html>

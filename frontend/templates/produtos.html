<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coleção Completa | Crazy Look Haitian</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="shortcut icon" href="/static/images/alfaiate_favicon.png" type="image/png">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #FDFCFB; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-thumb { background-color: #d6d3d1; border-radius: 4px; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .cart-anim { animation: slideIn 0.3s ease-out forwards; }
        
        h2[id] { scroll-margin-top: 120px; } 
    </style>
</head>
<body class="text-stone-800">

    <nav class="bg-white border-b border-stone-200 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 md:px-6 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center gap-2 group text-amber-600 hover:text-amber-700">
                <i class="fas fa-arrow-left"></i> <span class="font-serif font-bold uppercase text-sm md:text-base">Voltar</span>
            </a>
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <i class="fas fa-shopping-cart text-2xl text-stone-800"></i>
                <span id="cart-badge" class="absolute -top-1 -right-2 bg-red-600 text-white text-xs font-bold rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-10 px-3 sm:px-6 lg:px-8 space-y-16">
        
        <section>
            <div class="flex items-center gap-4 mb-8">
                <h2 id="colecao-feminina" class="text-2xl md:text-3xl font-serif font-bold text-stone-900">Coleção Feminina</h2>
                <div class="flex-1 h-px bg-stone-200"></div>
            </div>
            <div id="grid-feminino" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6 min-h-[100px]">
                <p class="text-stone-400 italic col-span-full">Carregando...</p>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-4 mb-8">
                <h2 id="colecao-masculina" class="text-2xl md:text-3xl font-serif font-bold text-stone-900">Coleção Masculina</h2>
                <div class="flex-1 h-px bg-stone-200"></div>
            </div>
            <div id="grid-masculino" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6 min-h-[100px]">
                <p class="text-stone-400 italic col-span-full">Carregando...</p>
            </div>
        </section>

        <section>
            <div class="flex items-center gap-4 mb-8">
                <h2 id="colecao-unissex" class="text-2xl md:text-3xl font-serif font-bold text-stone-900">Coleção Unissex</h2>
                <div class="flex-1 h-px bg-stone-200"></div>
            </div>
            <div id="grid-unissex" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-6 min-h-[100px]">
                <p class="text-stone-400 italic col-span-full">Carregando...</p>
            </div>
        </section>

    </main>

    <div id="modal-produto" class="fixed inset-0 z-50 hidden bg-stone-900/90 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl h-[85vh] rounded-2xl overflow-hidden flex flex-col md:flex-row relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 z-10 bg-white/80 p-2 rounded-full hover:bg-red-100 text-stone-500 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>

            <div class="w-full md:w-3/5 bg-stone-100 p-6 flex flex-col items-center justify-center">
                <img id="modal-img" src="" class="h-64 md:h-96 object-contain shadow-md rounded-lg bg-white">
                <div id="modal-thumbs" class="flex gap-2 mt-4 overflow-x-auto w-full justify-center p-2"></div>
            </div>

            <div class="w-full md:w-2/5 p-8 bg-white flex flex-col">
                <span id="modal-cat" class="text-xs font-bold text-amber-600 uppercase tracking-widest mb-2">Categoria</span>
                <h2 id="modal-title" class="text-3xl font-serif font-bold text-stone-900 mb-4 leading-tight">Nome</h2>
                <div class="flex-1 overflow-y-auto pr-2 custom-scroll text-stone-600 text-sm">
                    <p>Peça exclusiva feita sob medida com os melhores tecidos do mercado. Acabamento de alta costura.</p>
                </div>
                <div class="mt-6 pt-6 border-t border-stone-100">
                    <div class="text-4xl font-bold text-stone-900 mb-4" id="modal-price">R$ 0,00</div>
                    <button id="btn-add-cart" class="w-full bg-stone-900 hover:bg-stone-800 text-white py-4 rounded-xl font-bold text-lg shadow-lg flex items-center justify-center gap-3 transition">
                        <i class="fas fa-cart-plus"></i> Adicionar ao Carrinho
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-carrinho" class="hidden fixed inset-0 z-50 flex justify-end bg-black/50">
        <div class="bg-white w-full max-w-md h-full flex flex-col p-6 cart-anim shadow-2xl">
            <div class="flex justify-between items-center mb-6 border-b border-stone-100 pb-4">
                <h2 class="text-2xl font-bold text-stone-800"><i class="fas fa-shopping-cart text-amber-600"></i> Carrinho</h2>
                <button onclick="toggleCart()" class="text-stone-400 hover:text-red-500"><i class="fas fa-times text-xl"></i></button>
            </div>
            
            <div id="cart-list" class="flex-1 overflow-y-auto space-y-4 modal-scroll">
                <p class="text-center text-stone-400 mt-10">Carrinho vazio.</p>
            </div>

            <div class="mt-auto pt-6 border-t border-stone-200">
                <div class="flex justify-between items-end mb-4">
                    <span class="text-sm font-bold text-stone-500 uppercase">Total</span>
                    <span id="cart-total" class="text-3xl font-bold text-amber-600">R$ 0,00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-green-600 hover:bg-green-700 text-white py-4 rounded-xl font-bold text-lg shadow-lg flex justify-center items-center gap-2 transition">
                    <i class="fab fa-whatsapp text-2xl"></i> Finalizar no WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        let cart = JSON.parse(localStorage.getItem('crazyCart')) || [];
        let globalPhone = "5511999999999"; 

        document.addEventListener("DOMContentLoaded", () => {
            loadConfig();
            loadAllProducts(); 
            updateCartUI();
        });

        async function loadConfig() {
            try {
                const res = await fetch('/api/config');
                if (res.ok) {
                    const data = await res.json();
                    if(data.whatsapp) globalPhone = "55" + data.whatsapp.replace(/\D/g, '');
                }
            } catch(e) {}
        }

        // --- FUNÇÃO DE ADIÇÃO DIRETA AO CARRINHO ---
        function addToCartDirect(event, name, price, image) {
            event.stopPropagation(); // Evita abrir o modal
            
            cart.push({ name, price, image });
            saveCart();
            
            // Efeito visual no botão
            const btn = event.currentTarget;
            btn.innerHTML = '<i class="fas fa-check text-white"></i>';
            btn.classList.add('bg-green-500', 'border-green-500');
            btn.classList.remove('bg-white', 'text-stone-800');
            
            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-cart-plus text-sm md:text-lg"></i>';
                btn.classList.remove('bg-green-500', 'border-green-500');
                btn.classList.add('bg-white', 'text-stone-800');
                toggleCart();
            }, 800);
        }

        async function loadAllProducts() {
            try {
                const res = await fetch('/api/products');
                const products = await res.json();

                const femGrid = document.getElementById('grid-feminino');
                const mascGrid = document.getElementById('grid-masculino');
                const uniGrid = document.getElementById('grid-unissex');
                
                femGrid.innerHTML = ""; mascGrid.innerHTML = ""; uniGrid.innerHTML = "";

                if(products.length === 0) {
                    femGrid.innerHTML = "<p class='col-span-full'>Nenhum produto.</p>";
                    return;
                }

                products.forEach(p => {
                    const img = p.image || 'https://via.placeholder.com/300';
                    const safeName = p.name.replace(/'/g, "\\'"); // Escapar aspas simples

                    // HTML do Card atualizado para a proporção mobile (h-48, p-3, text-sm)
                    const html = `
                        <div onclick="openModal(${p.id})" class="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden cursor-pointer group hover:shadow-xl transition-all flex flex-col h-full relative">
                            <div class="h-48 md:h-80 w-full bg-gray-100 overflow-hidden relative">
                                <img src="${img}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                                
                                <button 
                                    onclick="addToCartDirect(event, '${safeName}', ${p.price}, '${img}')"
                                    class="absolute bottom-2 right-2 md:bottom-3 md:right-3 w-10 h-10 md:w-12 md:h-12 bg-white rounded-full shadow-lg flex items-center justify-center text-stone-800 hover:bg-amber-600 hover:text-white transition-all transform hover:scale-110 z-20 border border-stone-200" title="Adicionar ao Carrinho">
                                    <i class="fas fa-cart-plus text-sm md:text-lg"></i>
                                </button>

                                <div class="absolute inset-0 bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center pointer-events-none">
                                    <span class="bg-white/90 text-stone-900 px-3 py-2 md:px-6 md:py-3 rounded-full font-bold text-xs md:text-sm shadow-lg transform translate-y-4 group-hover:translate-y-0 transition-transform">
                                        <i class="fas fa-eye mr-2"></i> Ver Detalhes
                                    </span>
                                </div>
                            </div>
                            <div class="p-3 md:p-6 flex flex-col flex-1">
                                <h3 class="font-bold text-sm md:text-lg mb-1 md:mb-2 text-stone-800 leading-tight line-clamp-2">${p.name}</h3>
                                <div class="mt-auto">
                                    <p class="text-amber-700 text-base md:text-xl font-bold">R$ ${p.price.toFixed(2)}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    
                    if(p.category === 'feminino') femGrid.innerHTML += html;
                    else if(p.category === 'masculino') mascGrid.innerHTML += html;
                    else uniGrid.innerHTML += html;
                });

                if (window.location.hash) {
                    const id = window.location.hash.substring(1);
                    const element = document.getElementById(id);
                    if (element) {
                        setTimeout(() => {
                            element.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 300);
                    }
                }

            } catch(e) { console.error(e); }
        }

        async function openModal(id) {
            try {
                const res = await fetch(`/api/products/${id}`);
                const prod = await res.json();
                
                const mainImg = prod.images.find(i => i.is_main) || prod.images[0];
                
                document.getElementById('modal-title').innerText = prod.name;
                document.getElementById('modal-price').innerText = `R$ ${prod.price.toFixed(2)}`;
                
                let catText = 'Masculino';
                if(prod.category === 'feminino') catText = 'Feminino';
                if(prod.category === 'unisex') catText = 'Unissex';
                document.getElementById('modal-cat').innerText = `Moda ${catText}`;
                
                document.getElementById('modal-img').src = mainImg ? mainImg.path : '';

                const thumbs = document.getElementById('modal-thumbs');
                thumbs.innerHTML = "";
                prod.images.forEach(img => {
                    const t = document.createElement('img');
                    t.src = img.path;
                    t.className = "w-16 h-16 object-cover rounded cursor-pointer border-2 hover:border-amber-500 border-transparent";
                    t.onclick = () => document.getElementById('modal-img').src = img.path;
                    thumbs.appendChild(t);
                });

                const btn = document.getElementById('btn-add-cart');
                btn.onclick = () => addToCart(prod, mainImg ? mainImg.path : '');

                document.getElementById('modal-produto').classList.remove('hidden');
                document.body.style.overflow = 'hidden'; 

            } catch(e) { alert("Erro ao abrir produto."); }
        }

        function closeModal() {
            document.getElementById('modal-produto').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }

        function addToCart(prod, img) {
            cart.push({ ...prod, image: img });
            saveCart();
            closeModal();
            toggleCart();
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            saveCart();
        }

        function saveCart() {
            localStorage.setItem('crazyCart', JSON.stringify(cart));
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            badge.innerText = cart.length;
            badge.classList.toggle('hidden', cart.length === 0);

            const list = document.getElementById('cart-list');
            const totalEl = document.getElementById('cart-total');
            list.innerHTML = "";
            
            let total = 0;

            if(cart.length === 0) {
                list.innerHTML = '<p class="text-center text-stone-400 mt-10">Carrinho vazio.</p>';
            } else {
                cart.forEach((item, idx) => {
                    total += item.price;
                    list.innerHTML += `
                        <div class="flex gap-4 bg-stone-50 p-3 rounded-xl border border-stone-100">
                            <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
                            <div class="flex-1">
                                <h4 class="font-bold text-stone-800 text-sm line-clamp-1">${item.name}</h4>
                                <p class="text-amber-600 font-bold text-sm">R$ ${item.price.toFixed(2)}</p>
                            </div>
                            <button onclick="removeFromCart(${idx})" class="text-stone-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                        </div>
                    `;
                });
            }
            totalEl.innerText = `R$ ${total.toFixed(2)}`;
        }

        function toggleCart() {
            const el = document.getElementById('modal-carrinho');
            el.classList.toggle('hidden');
        }

        function checkout() {
            if(cart.length === 0) return alert("Adicione itens ao carrinho!");

            let msg = "*Olá! Gostaria de fazer o seguinte pedido no site:*\n\n";
            let total = 0;

            cart.forEach(i => {
                msg += `▪️ ${i.name} - R$ ${i.price.toFixed(2)}\n`;
                total += i.price;
            });

            msg += `\n💰 *TOTAL: R$ ${total.toFixed(2)}*`;
            msg += `\n\n_Aguardo instruções de pagamento._`;

            window.open(`https://wa.me/${globalPhone}?text=${encodeURIComponent(msg)}`, '_blank');
        }
    </script>
</body>
</html>

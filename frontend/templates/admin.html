<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Crazy Look</title>
    <link rel="icon" href="/static/images/alfaiate_favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-['Inter'] flex h-screen overflow-hidden">
    <script>
        // Verificação de Segurança no Frontend
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = '/login';
        }
    </script>

    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-stone-900 text-white flex flex-col shadow-2xl transform -translate-x-full lg:translate-x-0 lg:static transition-transform duration-300">
        <div class="p-6 border-b border-stone-700">
            <h1 class="text-2xl font-bold text-orange-500 italic">Crazy Look</h1>
            <p class="text-xs text-stone-400 mt-1">Painel Administrativo</p>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-600 text-white"><i class="fas fa-cogs"></i> Configurações</button>
        </nav>
        <div class="p-4 border-t border-stone-700">
            <button onclick="logout()" class="w-full flex items-center gap-2 px-4 py-2 text-red-400 hover:text-red-300 transition-colors">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
    </aside>

    <main class="flex-1 p-8 ml-0 lg:ml-64 transition-all">
        <h2 class="text-3xl font-bold text-stone-800">Bem-vindo ao Painel</h2>
        <p class="text-stone-500 mt-2">Selecione uma opção no menu lateral.</p>
    </main>

    <script src="/static/js/auth.js"></script>
</body>
</html>

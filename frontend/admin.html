<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Crazy Look</title>
    <link rel="icon" href="images/alfaiate_favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-['Inter'] flex h-screen overflow-hidden">

    <aside class="w-64 bg-stone-900 text-white flex flex-col shadow-2xl">
        <div class="p-6 border-b border-stone-700">
            <h1 class="text-2xl font-bold text-orange-500 italic">Crazy Look</h1>
            <p class="text-xs text-stone-400 mt-1">Painel Administrativo</p>
        </div>
        
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="showSection('config')" id="btn-config" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl bg-orange-600 text-white transition-all">
                <i class="fab fa-whatsapp text-lg"></i> Configurações
            </button>
            <button onclick="showSection('products')" id="btn-products" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-stone-800 text-stone-300 transition-all">
                <i class="fas fa-tshirt text-lg"></i> Produtos
            </button>
        </nav>

        <div class="p-4 border-t border-stone-700">
            <button onclick="logout()" class="w-full flex items-center gap-2 px-4 py-2 text-red-400 hover:text-red-300 transition-colors">
                <i class="fas fa-sign-out-alt"></i> Sair
            </button>
        </div>
    </aside>

    <main class="flex-1 overflow-y-auto p-8">
        
        <section id="sec-config" class="max-w-2xl">
            <h2 class="text-3xl font-bold text-stone-800 mb-6">Configurações Gerais</h2>
            <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-200">
                <div class="mb-6">
                    <label class="block text-sm font-bold uppercase text-stone-500 mb-2">Número do WhatsApp Principal</label>
                    <div class="flex gap-2">
                        <input type="text" id="admin-whatsapp" placeholder="5511999999999" class="flex-1 border border-gray-300 rounded-xl p-4 focus:outline-none focus:border-orange-500 transition-all">
                        <button onclick="saveWhatsApp()" class="bg-green-600 hover:bg-green-700 text-white px-6 rounded-xl font-bold transition-all">Salvar</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="sec-products" class="hidden">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-stone-800">Gerenciar Produtos</h2>
                <button onclick="openProductModal()" class="bg-orange-600 hover:bg-orange-700 text-white px-6 py-3 rounded-xl font-bold shadow-lg flex items-center gap-2">
                    <i class="fas fa-plus"></i> Novo Produto
                </button>
            </div>

            <div class="bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
                <table class="w-full text-left">
                    <thead class="bg-stone-50 text-stone-500 uppercase text-xs">
                        <tr>
                            <th class="p-6">Produto</th>
                            <th class="p-6">Preço</th>
                            <th class="p-6">Categoria</th>
                            <th class="p-6 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div id="modal-product" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-3xl p-8 max-w-2xl w-full shadow-2xl overflow-y-auto max-h-[90vh]">
            <h3 class="text-2xl font-bold mb-6 text-stone-800" id="modal-title">Novo Produto</h3>
            <form id="form-product" class="space-y-4">
                <input type="hidden" id="prod-id"> 
                
                <div>
                    <label class="text-xs font-bold uppercase text-stone-400">Nome</label>
                    <input type="text" id="prod-name" required class="w-full border p-3 rounded-xl mt-1 focus:border-orange-500 outline-none">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold uppercase text-stone-400">Preço (R$)</label>
                        <input type="text" id="prod-price" required class="w-full border p-3 rounded-xl mt-1 focus:border-orange-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold uppercase text-stone-400">Categoria</label>
                        <select id="prod-cat" class="w-full border p-3 rounded-xl mt-1 bg-white focus:border-orange-500 outline-none">
                            <option value="lista-feminina">Moda Feminina</option>
                            <option value="lista-masculina">Moda Masculina</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-stone-400">Imagem Principal</label>
                    <div class="mt-1 flex items-center gap-4">
                        <label class="cursor-pointer bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-xl font-bold shadow-md text-sm">
                            <i class="fas fa-upload"></i> Escolher
                            <input type="file" id="prod-img-input" accept="image/*" class="hidden" onchange="previewImage()">
                        </label>
                        <span id="file-name" class="text-xs text-stone-500 truncate max-w-[150px]">Nenhum arquivo...</span>
                    </div>
                    <div id="img-preview-container" class="hidden mt-3">
                        <img id="img-preview" src="" class="w-24 h-24 object-cover rounded-xl border-2 border-stone-200">
                    </div>
                    <input type="hidden" id="prod-img-base64">
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-stone-400">Galeria de Imagens</label>
                    <p class="text-xs text-stone-400 mb-2">Selecione múltiplas fotos para a galeria.</p>
                    <input type="file" id="prod-gallery-input" multiple accept="image/*" class="w-full border p-2 rounded-xl bg-gray-50 text-sm">
                    <input type="hidden" id="prod-gallery-json"> 
                </div>

                <div>
                    <label class="text-xs font-bold uppercase text-stone-400">Descrição</label>
                    <textarea id="prod-desc" rows="3" class="w-full border p-3 rounded-xl mt-1 focus:border-orange-500 outline-none"></textarea>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="button" onclick="closeProductModal()" class="flex-1 bg-gray-100 py-3 rounded-xl font-bold text-stone-600 hover:bg-gray-200">Cancelar</button>
                    <button type="submit" class="flex-1 bg-orange-600 py-3 rounded-xl font-bold text-white hover:bg-orange-700">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- FUNÇÕES UTILITÁRIAS ---
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        // --- NAVEGAÇÃO ---
        function showSection(section) {
            document.getElementById('sec-config').classList.add('hidden');
            document.getElementById('sec-products').classList.add('hidden');
            document.getElementById('sec-' + section).classList.remove('hidden');
            if(section === 'products') renderAdminProducts();
        }

        // --- WHATSAPP ---
        function loadWhatsApp() {
            document.getElementById('admin-whatsapp').value = localStorage.getItem('whatsapp_number') || '5511949113032';
        }
        function saveWhatsApp() {
            localStorage.setItem('whatsapp_number', document.getElementById('admin-whatsapp').value);
            alert('Salvo!');
        }

        // --- PRODUTOS ---
        let products = JSON.parse(localStorage.getItem('products')) || [];

        function renderAdminProducts() {
            const tbody = document.getElementById('admin-product-list');
            tbody.innerHTML = '';
            products.forEach((prod, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-6 flex items-center gap-4"><img src="${prod.image}" class="w-12 h-12 rounded-lg object-cover"><span class="font-bold text-stone-800">${prod.name}</span></td>
                    <td class="p-6 text-orange-600 font-bold">R$ ${prod.price}</td>
                    <td class="p-6 text-sm text-stone-500">${prod.category}</td>
                    <td class="p-6 text-right space-x-2">
                        <button onclick="editProduct(${index})" class="text-blue-500"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteProduct(${index})" class="text-red-500"><i class="fas fa-trash"></i></button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        function previewImage() {
            const file = document.getElementById('prod-img-input').files[0];
            if (file) {
                toBase64(file).then(base64 => {
                    document.getElementById('img-preview').src = base64;
                    document.getElementById('img-preview-container').classList.remove('hidden');
                    document.getElementById('prod-img-base64').value = base64;
                });
            }
        }

        function openProductModal(index = null) {
            document.getElementById('modal-product').classList.remove('hidden');
            document.getElementById('form-product').reset();
            document.getElementById('img-preview-container').classList.add('hidden');
            document.getElementById('prod-img-base64').value = "";
            document.getElementById('prod-gallery-json').value = "";
            
            if (index !== null) {
                document.getElementById('modal-title').innerText = "Editar Produto";
                const p = products[index];
                document.getElementById('prod-id').value = index;
                document.getElementById('prod-name').value = p.name;
                document.getElementById('prod-price').value = p.price;
                document.getElementById('prod-cat').value = p.category;
                document.getElementById('prod-desc').value = p.desc;
                
                // Imagem Principal
                if (p.image) {
                    document.getElementById('img-preview').src = p.image;
                    document.getElementById('img-preview-container').classList.remove('hidden');
                    document.getElementById('prod-img-base64').value = p.image;
                }
                // Galeria
                document.getElementById('prod-gallery-json').value = JSON.stringify(p.gallery || []);
            } else {
                document.getElementById('modal-title').innerText = "Novo Produto";
                document.getElementById('prod-id').value = '';
            }
        }

        function closeProductModal() { document.getElementById('modal-product').classList.add('hidden'); }

        document.getElementById('form-product').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('prod-id').value;
            
            try {
                // 1. Imagem Principal
                let mainImage = document.getElementById('prod-img-base64').value;
                if (!mainImage && id !== '') mainImage = products[id].image;
                if (!mainImage) mainImage = 'https://via.placeholder.com/400';

                // 2. Galeria (Novos Uploads)
                const galleryInput = document.getElementById('prod-gallery-input');
                let galleryArray = [];
                
                if (galleryInput.files.length > 0) {
                    for (let file of galleryInput.files) {
                        const b64 = await toBase64(file);
                        galleryArray.push(b64);
                    }
                } else {
                    const oldGallery = document.getElementById('prod-gallery-json').value;
                    if (oldGallery) galleryArray = JSON.parse(oldGallery);
                }

                const newProduct = {
                    name: document.getElementById('prod-name').value,
                    price: document.getElementById('prod-price').value,
                    category: document.getElementById('prod-cat').value,
                    image: mainImage,
                    gallery: galleryArray,
                    desc: document.getElementById('prod-desc').value
                };

                if (id !== '') products[id] = newProduct;
                else products.push(newProduct);

                localStorage.setItem('products', JSON.stringify(products));
                closeProductModal();
                renderAdminProducts();
                alert('Produto salvo com sucesso!');

            } catch (error) {
                console.error(error);
                alert('Erro ao salvar. O arquivo pode ser muito grande.');
            }
        });

        function editProduct(index) { openProductModal(index); }
        function deleteProduct(index) {
            if(confirm('Excluir?')) {
                products.splice(index, 1);
                localStorage.setItem('products', JSON.stringify(products));
                renderAdminProducts();
            }
        }
        function logout() { localStorage.removeItem('isLogged'); window.location.href = 'index.html'; }
        
        loadWhatsApp();
    </script>
</body>
</html>
